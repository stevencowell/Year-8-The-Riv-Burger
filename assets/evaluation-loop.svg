<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Evidence-based evaluation loop</title><desc id="d">Evaluation connects criterion, evidence, judgement and a specific improvement.</desc><rect width="900" height="520" rx="36" fill="#fffaf0"/><g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700"><text x="450" y="58" font-size="34" fill="#183b23">EVALUATION IS A REASONED JUDGEMENT</text><g font-size="22" fill="#183b23"><rect x="90" y="125" width="280" height="90" rx="28" fill="#e1a72c"/><text x="230" y="178">1 · CRITERION</text><rect x="530" y="125" width="280" height="90" rx="28" fill="#e8efe4"/><text x="670" y="178">2 · EVIDENCE</text><rect x="530" y="325" width="280" height="90" rx="28" fill="#f3d6cf"/><text x="670" y="378">3 · JUDGEMENT</text><rect x="90" y="325" width="280" height="90" rx="28" fill="#dfeadb"/><text x="230" y="365">4 · SPECIFIC</text><text x="230" y="393">IMPROVEMENT</text></g><g stroke="#b6402d" stroke-width="8" fill="none"><path d="M370 170H520M670 215V315M530 370H380M230 325V225"/></g></g></svg>
