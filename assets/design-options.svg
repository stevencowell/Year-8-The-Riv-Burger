<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">Four distinct burger concepts</title><desc id="d">Four concept cards prompt meaningful changes to filling, herb, structure and flavour before selection.</desc><rect width="900" height="560" rx="36" fill="#fffaf0"/><g font-family="Arial,sans-serif"><text x="450" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#183b23">MAKE FOUR IDEAS GENUINELY DIFFERENT</text><g font-size="20" fill="#183b23"><g transform="translate(55 105)"><rect width="370" height="170" rx="25" fill="#e8efe4"/><text x="25" y="42" font-weight="800">CONCEPT A</text><text x="25" y="82">Main filling: __________</text><text x="25" y="116">Garden herb: _________</text><text x="25" y="150">Structure: ____________</text></g><g transform="translate(475 105)"><rect width="370" height="170" rx="25" fill="#fff0c5"/><text x="25" y="42" font-weight="800">CONCEPT B</text><text x="25" y="82">Main filling: __________</text><text x="25" y="116">Garden herb: _________</text><text x="25" y="150">Flavour: ______________</text></g><g transform="translate(55 315)"><rect width="370" height="170" rx="25" fill="#f3d6cf"/><text x="25" y="42" font-weight="800">CONCEPT C</text><text x="25" y="82">Main filling: __________</text><text x="25" y="116">Garden herb: _________</text><text x="25" y="150">User need: ____________</text></g><g transform="translate(475 315)"><rect width="370" height="170" rx="25" fill="#dfeadb"/><text x="25" y="42" font-weight="800">CONCEPT D</text><text x="25" y="82">Main filling: __________</text><text x="25" y="116">Garden herb: _________</text><text x="25" y="150">Local feature: _________</text></g></g></g></svg>
