<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Production workplan sequence</title><desc id="d">A practical workplan protects time for setup, preparation, cooking, assembly, evidence and cleaning.</desc><rect width="1000" height="520" rx="36" fill="#fffaf0"/><g font-family="Arial,sans-serif"><text x="500" y="60" text-anchor="middle" font-size="34" font-weight="800" fill="#183b23">A WORKPLAN PROTECTS THE WHOLE LESSON</text><line x1="100" y1="270" x2="900" y2="270" stroke="#315d3a" stroke-width="12" stroke-linecap="round"/><g text-anchor="middle" font-size="19" font-weight="700" fill="#183b23"><g transform="translate(110 0)"><circle cy="270" r="43" fill="#e1a72c"/><text y="350">SET UP</text><text y="378">+ hygiene</text></g><g transform="translate(265 0)"><circle cy="270" r="43" fill="#e8efe4"/><text y="350">PREPARE</text></g><g transform="translate(420 0)"><circle cy="270" r="43" fill="#f3d6cf"/><text y="350">COOK</text><text y="378">+ check</text></g><g transform="translate(575 0)"><circle cy="270" r="43" fill="#fff0c5"/><text y="350">ASSEMBLE</text></g><g transform="translate(730 0)"><circle cy="270" r="43" fill="#dfeadb"/><text y="350">RECORD</text><text y="378">+ photograph</text></g><g transform="translate(890 0)"><circle cy="270" r="43" fill="#315d3a"/><text y="350">CLEAN</text><text y="378">+ approve</text></g></g><text x="500" y="455" text-anchor="middle" font-size="23" font-weight="700" fill="#b6402d">Teacher confirms the actual lesson time, date and supplied ingredients.</text></g></svg>
