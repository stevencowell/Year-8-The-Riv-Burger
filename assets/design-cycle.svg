<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Riv Burger design cycle</title><desc id="d">A five-stage cycle from investigate to evaluate.</desc><rect width="900" height="520" rx="36" fill="#fffaf0"/><g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700"><circle cx="450" cy="260" r="92" fill="#315d3a"/><text x="450" y="247" fill="white" font-size="27">THE RIV</text><text x="450" y="282" fill="white" font-size="27">BURGER</text><g font-size="22" fill="#183b23"><rect x="345" y="32" width="210" height="70" rx="28" fill="#e1a72c"/><text x="450" y="75">1 · INVESTIGATE</text><rect x="642" y="154" width="210" height="70" rx="28" fill="#e8efe4"/><text x="747" y="197">2 · GENERATE</text><rect x="530" y="414" width="210" height="70" rx="28" fill="#e8efe4"/><text x="635" y="457">3 · PLAN</text><rect x="160" y="414" width="210" height="70" rx="28" fill="#e8efe4"/><text x="265" y="457">4 · PRODUCE</text><rect x="48" y="154" width="210" height="70" rx="28" fill="#f3d6cf"/><text x="153" y="197">5 · EVALUATE</text></g></g><g stroke="#b6402d" stroke-width="8" fill="none" stroke-linecap="round"><path d="M555 82 Q680 85 700 150"/><path d="M760 225 Q760 350 690 410"/><path d="M520 465 Q450 500 380 465"/><path d="M210 410 Q140 350 140 230"/><path d="M185 150 Q245 70 335 70"/></g></svg>
