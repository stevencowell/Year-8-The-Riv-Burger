<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d"><title id="t">What a healthy herb plant needs</title><desc id="d">Light, water, air, nutrients, suitable temperature and root space interact to support healthy plant growth.</desc><rect width="900" height="600" rx="36" fill="#fffaf0"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="450" y="58" font-size="34" font-weight="800" fill="#183b23">PLANT NEEDS WORK TOGETHER</text><circle cx="450" cy="315" r="105" fill="#315d3a"/><text x="450" y="303" font-size="28" font-weight="800" fill="white">HEALTHY</text><text x="450" y="340" font-size="28" font-weight="800" fill="white">HERB</text><g font-size="22" font-weight="700" fill="#183b23"><circle cx="450" cy="130" r="67" fill="#e1a72c"/><text x="450" y="138">LIGHT</text><circle cx="680" cy="220" r="67" fill="#b9d8ec"/><text x="680" y="228">WATER</text><circle cx="650" cy="465" r="67" fill="#e8efe4"/><text x="650" y="473">AIR</text><circle cx="250" cy="465" r="67" fill="#c8a77a"/><text x="250" y="473">SOIL</text><circle cx="220" cy="220" r="67" fill="#dfeadb"/><text x="220" y="212">NUTRIENTS</text><text x="220" y="239">+ SPACE</text></g><g stroke="#b6402d" stroke-width="6"><path d="M450 197V210M612 245L550 275M585 430L530 380M315 430L370 380M288 245L350 275"/></g></g></svg>
