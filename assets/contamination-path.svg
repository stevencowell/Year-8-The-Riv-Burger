<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Stop cross-contamination</title><desc id="d">Raw food, hands and tools can transfer contamination to ready-to-eat food unless separation, washing and sanitising controls break the path.</desc><rect width="900" height="520" rx="36" fill="#fffaf0"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="450" y="58" font-size="34" font-weight="800" fill="#183b23">BREAK THE CONTAMINATION PATH</text><g font-size="24" font-weight="700"><rect x="45" y="140" width="200" height="120" rx="26" fill="#f3d6cf"/><text x="145" y="190" fill="#8e2e20">RAW FOOD</text><text x="145" y="225" fill="#8e2e20">or allergen</text><rect x="350" y="140" width="200" height="120" rx="26" fill="#fff0c5"/><text x="450" y="190" fill="#6a4b00">HANDS · TOOLS</text><text x="450" y="225" fill="#6a4b00">or surfaces</text><rect x="655" y="140" width="200" height="120" rx="26" fill="#e8efe4"/><text x="755" y="190" fill="#315d3a">READY-TO-EAT</text><text x="755" y="225" fill="#315d3a">food</text></g><g stroke="#b6402d" stroke-width="9" fill="none"><path d="M245 200H345"/><path d="M550 200H650"/></g><g font-size="22" font-weight="700" fill="#183b23"><rect x="150" y="340" width="600" height="110" rx="28" fill="#dfeadb"/><text x="450" y="382">BREAK THE PATH: separate · wash · sanitise</text><text x="450" y="420">use teacher-directed storage and equipment</text></g></g></svg>
