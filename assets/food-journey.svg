<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Ingredient journey from farm to burger</title><desc id="d">Primary production connects through processing, transport and preparation to the final burger, with evidence required for local and sustainable claims.</desc><rect width="1000" height="430" rx="36" fill="#fffaf0"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="58" font-size="34" font-weight="800" fill="#183b23">TRACE THE INGREDIENT JOURNEY</text><g font-size="22" font-weight="700" fill="#183b23"><rect x="30" y="145" width="170" height="100" rx="25" fill="#dfeadb"/><text x="115" y="187">GROW or</text><text x="115" y="219">RAISE</text><rect x="225" y="145" width="170" height="100" rx="25" fill="#fff0c5"/><text x="310" y="205">PROCESS</text><rect x="420" y="145" width="170" height="100" rx="25" fill="#e8efe4"/><text x="505" y="205">TRANSPORT</text><rect x="615" y="145" width="170" height="100" rx="25" fill="#f3d6cf"/><text x="700" y="205">PREPARE</text><rect x="810" y="145" width="160" height="100" rx="25" fill="#e1a72c"/><text x="890" y="205">SERVE</text></g><g stroke="#b6402d" stroke-width="7"><path d="M200 195H225M395 195H420M590 195H615M785 195H810"/></g><text x="500" y="330" font-size="25" font-weight="700" fill="#315d3a">A strong “local” claim names the producer, place and evidence.</text><text x="500" y="370" font-size="22" fill="#5f685f">Compare the whole system—not only the label.</text></g></svg>
